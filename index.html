
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neo AI</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#101114;
  color:#fff;
  font-family:Arial,sans-serif;
}
main{
  max-width:720px;
  margin:auto;
  padding:22px;
}
header{
  padding:12px 0;
}
h1{margin:0 0 8px}
#status{
  color:#aaa;
  font-size:14px;
  line-height:1.5;
}
#chat{
  height:55vh;
  min-height:300px;
  overflow-y:auto;
  border:1px solid #333;
  border-radius:14px;
  padding:12px;
  margin:20px 0;
}
.msg{
  padding:13px;
  margin:10px 0;
  border-radius:12px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  line-height:1.6;
}
.user{background:#293b60}
.ai{background:#24262b}
textarea{
  width:100%;
  background:#202126;
  color:white;
  border:1px solid #444;
  border-radius:12px;
  padding:14px;
  font-size:16px;
  resize:vertical;
}
button{
  background:#4778ed;
  color:white;
  border:0;
  border-radius:10px;
  padding:13px 18px;
  margin-top:10px;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
}
button:disabled{opacity:.5}
#progress{
  width:100%;
  height:7px;
  background:#292929;
  border-radius:10px;
  margin-top:12px;
  overflow:hidden;
}
#bar{
  width:0%;
  height:100%;
  background:#4778ed;
  transition:width .2s;
}
</style>
</head>

<body>
<main>
<header>
  <h1>Neo AI</h1>
  <p id="status">DeepSeek belum dimuat.</p>
  <div id="progress"><div id="bar"></div></div>
  <button id="load">Muat DeepSeek AI</button>
</header>

<div id="chat">
  <div class="msg ai">
    Halo! Gw Neo AI. Muat model terlebih dahulu untuk mulai mengobrol.
  </div>
</div>

<textarea id="input" rows="3"
placeholder="Tulis pesan lu di sini..."></textarea>

<button id="send" disabled>Kirim</button>
</main>

<script type="module">
const status = document.getElementById("status");
const loadBtn = document.getElementById("load");
const sendBtn = document.getElementById("send");
const input = document.getElementById("input");
const chat = document.getElementById("chat");
const bar = document.getElementById("bar");

let ai = null;
let history = [];

function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

loadBtn.addEventListener("click", async () => {
  if (ai) return;

  loadBtn.disabled = true;
  status.textContent = "Menyiapkan mesin AI...";
  bar.style.width = "0%";

  try {
    const { Wllama } = await import(
      "https://esm.sh/@wllama/wllama@3.8.1"
    );

    const { default: WasmFromCDN } = await import(
      "https://esm.sh/@wllama/wllama@3.8.1/esm/wasm-from-cdn.js"
    );

    ai = new Wllama(WasmFromCDN);

    status.textContent = "Mengunduh model DeepSeek...";

    await ai.loadModelFromHF(
      {
        repo: "bartowski/DeepSeek-R1-Distill-Qwen-1.5B-GGUF",
        file: "DeepSeek-R1-Distill-Qwen-1.5B-Q4_K_M.gguf"
      },
      {
        n_ctx: 2048,
        progressCallback: ({ loaded, total }) => {
          if (total > 0) {
            const percent = Math.round(
              (loaded / total) * 100
            );
            bar.style.width = percent + "%";
            status.textContent =
              "Mengunduh model: " + percent + "%";
          }
        }
      }
    );

    status.textContent = "DeepSeek berhasil dimuat!";
    bar.style.width = "100%";
    loadBtn.textContent = "DeepSeek Aktif";
    sendBtn.disabled = false;

  } catch (error) {
    console.error(error);
    ai = null;
    status.textContent = "Gagal: " + error.message;
    loadBtn.disabled = false;
    loadBtn.textContent = "Coba Muat Ulang";
  }
});

sendBtn.addEventListener("click", async () => {
  const question = input.value.trim();

  if (!question || !ai) return;

  input.value = "";
  sendBtn.disabled = true;

  addMessage("user", question);
  history.push({
    role: "user",
    content: question
  });

  const answerBox = addMessage("ai", "Sedang berpikir...");

  try {
    const result = await ai.createChatCompletion({
      messages: history,
      max_tokens: 300,
      temperature: 0.7
    });

    const answer =
      result.choices[0].message.content;

    answerBox.textContent = answer;

    history.push({
      role: "assistant",
      content: answer
    });

  } catch (error) {
    console.error(error);
    answerBox.textContent =
      "Terjadi kesalahan: " + error.message;
  }

  sendBtn.disabled = false;
});

input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendBtn.click();
  }
});
</script>
</body>
</html>
