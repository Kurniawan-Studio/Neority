
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neo AI</title>
<style>
body{margin:0;background:#101114;color:white;font-family:Arial,sans-serif}
main{max-width:700px;margin:auto;padding:24px}
h1{margin-top:20px}
#status{color:#aaa;font-size:14px}
#chat{height:55vh;overflow:auto;border:1px solid #333;border-radius:12px;padding:14px;margin:20px 0}
.msg{padding:12px;margin:10px 0;border-radius:10px;white-space:pre-wrap;line-height:1.5}
.user{background:#293b60}
.ai{background:#24262b}
textarea{width:100%;box-sizing:border-box;background:#202126;color:white;border:1px solid #444;border-radius:10px;padding:14px;font-size:16px}
button{background:#4778ed;color:white;border:0;border-radius:9px;padding:13px 18px;margin-top:10px;font-weight:bold}
button:disabled{opacity:.5}
</style>
</head>
<body>
<main>
<h1>Neo AI</h1>
<p id="status">Model belum dimuat.</p>
<button id="load">Muat DeepSeek AI</button>
<div id="chat"></div>
<textarea id="input" rows="3" placeholder="Tulis pesan..."></textarea>
<button id="send" disabled>Kirim</button>
</main>

<script type="module">
import { Wllama } from "https://esm.sh/@wllama/wllama@3.8.1";
import WasmFromCDN from "https://esm.sh/@wllama/wllama@3.8.1/esm/wasm-from-cdn.js";

const status = document.getElementById("status");
const loadBtn = document.getElementById("load");
const sendBtn = document.getElementById("send");
const input = document.getElementById("input");
const chat = document.getElementById("chat");

let ai = null;
let history = [];

function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

loadBtn.onclick = async () => {
  loadBtn.disabled = true;
  status.textContent = "Mengunduh dan memuat model...";

  try {
    ai = new Wllama(WasmFromCDN);

    await ai.loadModelFromHF({
      repo: "bartowski/DeepSeek-R1-Distill-Qwen-1.5B-GGUF",
      file: "DeepSeek-R1-Distill-Qwen-1.5B-Q4_K_M.gguf"
    }, { n_ctx: 2048 });

    status.textContent = "DeepSeek siap digunakan.";
    sendBtn.disabled = false;
    loadBtn.textContent = "Model sudah dimuat";
  } catch (error) {
    status.textContent = "Gagal memuat: " + error.message;
    loadBtn.disabled = false;
  }
};

sendBtn.onclick = async () => {
  const question = input.value.trim();
  if (!question || !ai) return;

  input.value = "";
  sendBtn.disabled = true;
  addMessage("user", question);

  history.push({ role: "user", content: question });
  const answerBox = addMessage("ai", "Sedang berpikir...");

  try {
    const result = await ai.createChatCompletion({
      messages: history,
      max_tokens: 300,
      temperature: 0.7
    });

    const answer = result.choices[0].message.content;
    answerBox.textContent = answer;
    history.push({ role: "assistant", content: answer });
  } catch (error) {
    answerBox.textContent = "Terjadi kesalahan: " + error.message;
  }

  sendBtn.disabled = false;
};

input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendBtn.click();
  }
});
</script>
</body>
</html>
